name: Privacy checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Synthetic rejection and real Git pre-push tests
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Scan source and all reachable history
        run: python3 -B scripts/release_guard.py check --ci
