name: Publish validated server image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.5.1
        required: true
        default: v0.5.1
      audit_only:
        description: Check all assets without uploading an image
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  privacy:
    name: Required privacy and checksum gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image_archive: ${{ steps.gate.outputs.image_archive }}
      image_sha256: ${{ steps.gate.outputs.image_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Test the privacy gate with synthetic leaks
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Check source and complete release history
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          revision="$(git rev-parse "$TAG^{commit}")"
          python3 -B scripts/release_guard.py check --ci --ref "$revision"
      - name: Download and inspect every release asset and every image layer
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts
          python3 -B scripts/verify-release-artifacts.py --directory artifacts --tag "$TAG"
  publish:
    name: Upload the approved immutable image
    needs: privacy
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.audit_only }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch the exact archive approved by the privacy job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ needs.privacy.outputs.image_archive }}
          EXPECTED_SHA: ${{ needs.privacy.outputs.image_sha256 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{64}$ ]]
          version="${TAG#v}"
          test "$ASSET" = "MoonUESTC-${TAG}-linux-amd64.image.tar.gz"
          mkdir artifacts
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir artifacts
          cd artifacts
          printf '%s  %s\n' "$EXPECTED_SHA" "$ASSET" | sha256sum -c -
          docker load --input "$ASSET"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moonuestc:$version"
          revision="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$revision"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$version"
          test "$(docker image inspect "$image" --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/$GITHUB_REPOSITORY"
          printf 'RELEASE_IMAGE=%s\nRELEASE_VERSION=%s\n' "$image" "$version" >> "$GITHUB_ENV"
      - name: Publish only after the required privacy gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker push "$RELEASE_IMAGE"
          namespace="${RELEASE_IMAGE%:*}"
          minor="${RELEASE_VERSION%.*}"
          docker tag "$RELEASE_IMAGE" "$namespace:$minor"
          docker tag "$RELEASE_IMAGE" "$namespace:latest"
          docker push "$namespace:$minor"
          docker push "$namespace:latest"
          printf 'Privacy gate passed; uploaded verified image %s\n' "$RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
