<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>注册 · 晚安成电自动打卡系统</title><link rel="icon" href="/static/moon.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/vendor/altcha-3.4.1.css"><script type="module" src="/static/register.js"></script></head>
<body class="login-page"><main class="login-shell"><section class="login-story"><a class="brand login-brand" href="/login"><span class="brand-mark">☾</span><span>晚安成电<small>自动打卡系统</small></span></a><div class="night-art" aria-hidden="true"><span class="art-orbit orbit-one"></span><span class="art-orbit orbit-two"></span><span class="art-moon"></span><i class="star star-a"></i><i class="star star-b"></i><i class="star star-c"></i><span class="building b-one"></span><span class="building b-two"></span><span class="building b-three"></span></div><div class="story-copy"><span class="eyebrow">GOOD NIGHT, UESTC</span><h1>把每晚的事，<br>安排得井井有条。</h1></div><footer class="story-footer"><span class="status-dot"></span> 独立账号 · 权限隔离 · 结果复查</footer></section><section class="login-form-panel register-panel"><div class="login-mobile-brand">☾ 晚安成电</div><div class="form-intro"><span class="eyebrow">创建账号</span><h2>加入管理工作台</h2><p>只需设置用户名和密码，即可管理自己的打卡账号。</p></div>
<form id="register-form"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="48" placeholder="3–48 个字符"><small class="field-hint">支持中英文、数字、点、短横线或下划线。</small>
<label for="password">登录密码</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128" placeholder="至少 12 个字符">
<label for="confirm-password">确认密码</label><input id="confirm-password" type="password" autocomplete="new-password" required minlength="12" maxlength="128" placeholder="再次输入密码">
<div class="registration-verification"><altcha-widget id="registration-captcha" challenge="/api/registration/challenge" language="zh-cn" workers="2" auto="off"></altcha-widget><small class="field-hint">本机完成短暂计算后验证，无需提供邮箱。</small></div>
<div id="register-error" class="form-error" role="alert" hidden></div><button class="button primary login-submit" id="register-submit" type="submit">创建账号 <span aria-hidden="true">→</span></button></form>
<p class="auth-switch">已有账号？<a href="/login">返回登录</a></p><div class="login-note"><span class="note-icon">i</span><p>注册的是本系统普通用户账号。<br>学校统一认证账号可在登录后单独添加。</p></div><footer class="login-bottom">晚安成电自动打卡系统 <span id="register-version"></span></footer></section></main></body></html>
